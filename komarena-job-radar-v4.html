<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KomArena.sk Job Radar – Práca pre Jara</title><style>html,body{margin:0;height:100%;background:#071014;font-family:system-ui,-apple-system,Segoe UI,Arial}#radar{width:100%;height:100vh;border:0;display:block}.builder{position:fixed;inset:0;background:#020608e8;z-index:99999;display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}.builder.show{display:flex}.shell{width:min(1100px,100%);background:#0d191f;color:#eef8f7;border:1px solid #315862;border-radius:20px;box-shadow:0 30px 100px #0009;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:#102229;border-bottom:1px solid #29464f}.head h2{margin:0;font-size:22px}.head button,.actions button{background:#17303a;color:#eef8f7;border:1px solid #35616b;border-radius:9px;padding:8px 10px;cursor:pointer}.body{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{background:#091419;border:1px solid #24434c;border-radius:14px;padding:13px}.box h3{margin:0 0 8px;color:#67e8d3;font-size:15px}.box textarea{width:100%;min-height:270px;background:#061014;color:#eef8f7;border:1px solid #29464f;border-radius:10px;padding:10px;resize:vertical;font:14px/1.5 system-ui}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions .primary{background:linear-gradient(90deg,#00a7a5,#58d5bd);color:#031313;border:0;font-weight:900}.full{grid-column:1/-1}.reasons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.reasons div{background:#0c1c22;border:1px solid #27454e;border-radius:10px;padding:9px;color:#bfd0d2;font-size:12px}.hint{font-size:12px;color:#91a7aa;margin-top:6px}@media(max-width:800px){.body{grid-template-columns:1fr}.full{grid-column:auto}.reasons{grid-template-columns:1fr}}</style></head><body><iframe id="radar" src="https://raw.githack.com/Jarekkom86/dochadzka-pro-sk/d8f85516cb76430de87159553bfebfedf77a75d0/komarena-job-radar-v4.html"></iframe><div class="builder" id="builder"><div class="shell"><div class="head"><div><div style="color:#91a7aa;font-size:11px;letter-spacing:.12em;text-transform:uppercase">KomArena.sk • Application Builder</div><h2 id="title">Personalizovaná reakcia</h2></div><button id="close">Zavrieť ✕</button></div><div class="body"><div class="box"><h3>1. Reakcia na ponuku</h3><textarea id="reaction"></textarea><div class="actions"><button class="primary" id="copy">Skopírovať reakciu</button><button id="short">Skrátiť</button><button id="formal">Formálnejšie</button></div></div><div class="box"><h3>2. Personalizované CV podľa MASTER</h3><textarea id="cv"></textarea><div class="actions"><button class="primary" id="download">Stiahnuť CV HTML</button><button id="print">Otvoriť na tlač / PDF</button></div><div class="hint">Používajú sa iba doložiteľné údaje z MASTER profilu; nič sa nevymýšľa.</div></div><div class="box full"><h3>3. Prečo sa hodíš na túto pozíciu</h3><div class="reasons" id="reasons"></div></div></div></div></div><script>const PROFILE={name:'Jaroslav Koman',summary:'Prakticky orientovaný technický a prevádzkový profesionál so skúsenosťami so správou WordPress/WooCommerce, e-commerce administráciou, technickou diagnostikou, reklamáciami, zákazníckou komunikáciou, Smart Home/IoT a riadením prevádzky.',strengths:['WordPress a WooCommerce – správa webu, produktov, obsahu a bežná administrácia','E-commerce a produktová administrácia – kategórie, produkty, obsah a procesy','Smart Home / IoT – Home Assistant, Aqara, Shelly, Sonoff, Aeotec, diagnostika a servis','Reklamácie a technický troubleshooting – identifikácia problému a praktické riešenie','Zákaznícky servis a komunikácia – riešenie požiadaviek, eskalácií a procesov','Retail / operations – približne 10 rokov manažérskej praxe a vedenie tímu približne 20 ľudí','Windows / Microsoft Office a AI nástroje v každodennej práci','Samostatnosť, zodpovednosť, organizácia práce a orientácia na výsledok']};let current=null,mode='normal';const b=document.getElementById('builder'),reaction=document.getElementById('reaction'),cv=document.getElementById('cv'),rs=document.getElementById('reasons');function clean(t){return(t||'').replace(/\s+/g,' ').trim()}function strengths(card){const t=clean(card.innerText).toLowerCase(),o=[],a=x=>{if(!o.includes(x))o.push(x)};if(/wordpress|woocommerce|e-shop|eshop|ecommerce|e-commerce|shoptet|shopify|marketplace|content|produkt/.test(t)){a(PROFILE.strengths[0]);a(PROFILE.strengths[1])}if(/techn|support|iot|smart|home assistant|servis|diagnost|reklam/.test(t)){a(PROFILE.strengths[2]);a(PROFILE.strengths[3])}if(/zákaz|customer|support|komunik|administr/.test(t))a(PROFILE.strengths[4]);if(/manager|operations|prevádz|retail|team|vedenie/.test(t))a(PROFILE.strengths[5]);a(PROFILE.strengths[6]);a(PROFILE.strengths[7]);return o.slice(0,5)}function react(card,m='normal'){const title=clean(card.querySelector('h3')?.textContent),company=clean(card.querySelector('.company')?.textContent).split('•')[0].trim(),desc=clean(card.querySelector('p')?.textContent),ss=strengths(card);let intro='Dobrý deň,\n\nreagujem na ponuku „'+title+'“'+(company?' v spoločnosti '+company:'')+'.';let body='Zaujala ma najmä kombinácia praktickej operatívy, práce so systémami a zodpovednosti za výsledok. V praxi sa venujem WordPress/WooCommerce, e-commerce administrácii, technickej diagnostike a zákazníckej podpore. Mám tiež dlhoročnú skúsenosť s riadením prevádzky a riešením každodenných procesov.';if(/iot|smart|techn|support|servis/.test(desc.toLowerCase()))body='Zaujala ma najmä technická a praktická stránka pozície. Venujem sa servisu a integrácii Smart Home/IoT, diagnostike problémov, Home Assistantu a práci so zariadeniami Aqara, Shelly, Sonoff a Aeotec. Zároveň mám skúsenosti s reklamáciami, zákazníckou komunikáciou a systematickým riešením problémov.';if(/e-shop|eshop|ecommerce|e-commerce|marketplace|wordpress|woocommerce|shoptet|shopify|content/.test((title+' '+desc).toLowerCase()))body='Zaujala ma najmä práca s e-shopom, obsahom a každodennou operatívou. Prakticky pracujem s WordPress/WooCommerce, produktovým obsahom, kategóriami a správou webových riešení. Popri tom využívam technické myslenie, zákaznícku skúsenosť, Office a AI nástroje na zrýchlenie rutinnej práce a kontrolu kvality.';if(m==='short')return intro+'\n\n'+body+'\n\nRád sa s Vami spojím a preberiem podrobnosti.\n\nS pozdravom\nJaroslav Koman';if(m==='formal')return'Dobrý deň,\n\nna základe zverejnenej pracovnej ponuky „'+title+'“'+(company?' v spoločnosti '+company:'')+' si Vám dovoľujem zaslať svoju reakciu.\n\n'+body+'\n\nZa relevantné pre túto pozíciu považujem najmä:\n- '+ss.join('\n- ')+'\n\nBudem rád za možnosť osobného alebo online rozhovoru, počas ktorého môžeme prejsť moje skúsenosti aj Vaše očakávania.\n\nS pozdravom\nJaroslav Koman';return intro+'\n\n'+body+'\n\nPre túto pozíciu viem ponúknuť najmä:\n- '+ss.join('\n- ')+'\n\nRád si s Vami prejdem konkrétnu náplň práce a očakávania. V prípade záujmu viem reagovať flexibilne a dohodnúť sa na ďalšom postupe.\n\nS pozdravom\nJaroslav Koman'}function cvtext(card){const title=clean(card.querySelector('h3')?.textContent),company=clean(card.querySelector('.company')?.textContent).split('•')[0].trim(),ss=strengths(card);return'JAROSLAV KOMAN\nCielené CV pre: '+title+(company?' – '+company:'')+'\n\nPROFIL\n'+PROFILE.summary+'\n\nKĽÚČOVÉ ZRUČNOSTI PRE TÚTO POZÍCIU\n• '+ss.join('\n• ')+'\n\nRELEVANTNÁ PRAX\n\nWordPress / WooCommerce a e-commerce projekty\nSpráva a úprava webových a e-commerce riešení, produktového obsahu, kategórií, WooCommerce administrácie, bežnej údržby a zlepšovania používateľského fungovania.\n\nTechnický servis / Smart Home / IoT\nServis, diagnostika a integrácia zariadení Aqara, Shelly, Sonoff a Aeotec, práca s Home Assistant a riešenie technických problémov v teréne.\n\nRetail / operations management\nPribližne 10 rokov manažérskej praxe, vedenie tímu približne 20 ľudí, zodpovednosť za chod prevádzky, zamestnancov, výsledky, procesy a zákaznícku skúsenosť.\n\nĎALŠIE KOMPETENCIE\n• Windows a Microsoft Office\n• AI nástroje ako pracovná pomôcka\n• Zákaznícka komunikácia a reklamácie\n• Organizácia práce a procesov\n• Samostatné riešenie problémov\n• Vodičský preukaz skupiny B'}function cvhtml(t){let o='<!doctype html><html><head><meta charset="utf-8"><title>CV Jaroslav Koman</title><style>body{font:15px/1.5 Arial;max-width:850px;margin:40px auto;color:#202428;padding:0 28px}h1{font-size:30px}h2{font-size:17px;border-bottom:2px solid #00a7a5;padding-bottom:5px}.brand{color:#00a7a5;font-weight:bold;text-align:right}</style></head><body><div class="brand">KomArena.sk • Personalized CV</div>';for(const l of t.split('\n')){if(l==='JAROSLAV KOMAN')o+='<h1>'+l+'</h1>';else if(/^(PROFIL|KĽÚČOVÉ ZRUČNOSTI PRE TÚTO POZÍCIU|RELEVANTNÁ PRAX|ĎALŠIE KOMPETENCIE)$/.test(l))o+='<h2>'+l+'</h2>';else if(l.trim())o+='<p>'+l+'</p>'}return o+'</body></html>'}function open(card){current=card;mode='normal';reaction.value=react(card);cv.value=cvtext(card);document.getElementById('title').textContent='Reakcia: '+clean(card.querySelector('h3')?.textContent);rs.innerHTML=strengths(card).map(x=>'<div>'+x+'</div>').join('');b.classList.add('show')}function inject(){const f=document.getElementById('radar');let d;try{d=f.contentDocument}catch(e){return}if(!d)return;let s=d.getElementById('ka-app-style');if(!s){s=d.createElement('style');s.id='ka-app-style';s.textContent='.kaCreateReaction{background:#163942!important;color:#8ff5e0!important;border-color:#2d6a72!important;font-weight:900!important}';d.head.appendChild(s)}d.querySelectorAll('.card').forEach(card=>{if(card.querySelector('.kaCreateReaction'))return;const crm=card.querySelector('.crm');if(!crm)return;const btn=d.createElement('button');btn.type='button';btn.className='kaCreateReaction';btn.textContent='✦ Vytvoriť reakciu';btn.onclick=()=>open(card);crm.prepend(btn)})}document.getElementById('radar').addEventListener('load',()=>{inject();setTimeout(inject,700)});document.getElementById('close').onclick=()=>b.classList.remove('show');b.onclick=e=>{if(e.target===b)b.classList.remove('show')};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(reaction.value);document.getElementById('copy').textContent='✓ Skopírované';setTimeout(()=>document.getElementById('copy').textContent='Skopírovať reakciu',1200)};document.getElementById('short').onclick=()=>{if(current)reaction.value=react(current,'short')};document.getElementById('formal').onclick=()=>{if(current)reaction.value=react(current,'formal')};document.getElementById('download').onclick=()=>{const bl=new Blob([cvhtml(cv.value)],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='CV_Jaroslav_Koman_personalizovane.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('print').onclick=()=>{const w=window.open('','_blank');w.document.write(cvhtml(cv.value));w.document.close();setTimeout(()=>w.print(),300)};</script></body></html>
